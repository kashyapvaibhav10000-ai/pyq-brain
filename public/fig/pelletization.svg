<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" width="360" height="448" role="img" aria-label="Pelletization process (extrusion–spheronization)"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle">Mixing of API + excipients</text><line x1="208" y1="17.5" x2="216" y2="17.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="21.0" font-size="11" text-anchor="start">homogeneous blend</text><line x1="108.0" y1="31.0" x2="108.0" y2="58.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 51.0 L108.0 59.0 L113.0 51.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="116.0" y="49.0" font-size="11" text-anchor="start" style="fill:var(--b)">binder solution</text><rect x="8" y="60.0" width="200" height="38" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="82.5" font-size="12" text-anchor="middle">Wet massing</text><line x1="208" y1="79.0" x2="216" y2="79.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="75.0" font-size="11" text-anchor="start">plastic mass for</text><text x="220.0" y="89.0" font-size="11" text-anchor="start">extrusion</text><line x1="108.0" y1="98.0" x2="108.0" y2="124.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 117.0 L108.0 125.0 L113.0 117.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="126.0" width="200" height="38" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="148.5" font-size="12" text-anchor="middle">Extrusion</text><line x1="208" y1="145.0" x2="216" y2="145.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="141.0" f