<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 445" width="360" height="445" role="img" aria-label="Ceiling price calculation (DPCO 2013, NPPA)"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle">Step 1: identify all</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle">brands of the scheduled</text><text x="108.0" y="51.0" font-size="12" text-anchor="middle">formulation</text><line x1="108.0" y1="61.0" x2="108.0" y2="87.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 80.0 L108.0 88.0 L113.0 80.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="89.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="106.0" font-size="12" text-anchor="middle">Step 2: find each brand's</text><text x="108.0" y="121.0" font-size="12" text-anchor="middle">market share</text><line x1="208" y1="110.0" x2="216" y2="110.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="113.5" font-size="11" text-anchor="start">IMS / IQVIA data</text><line x1="108.0" y1="131.0" x2="108.0" y2="157.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 150.0 L108.0 158.0 L113.0 150.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="159.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="176.0" font-size="12" text-anchor="middle">Step 3: shortlist brands</text><text x="108.0" y="191.0" font-size="12" text-anchor="middle">with ≥ 1% market share</text><line x1="108.0" y1="201.0" x2="108.0" y2="227.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 220.0 L108.0 228.0 L113.0 220.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="229.0" width="200" height="57" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="246.0" font-size="12" text-anchor="middle" style="fill:var(--b)">Step 4: simple average</text><text x="108.0" y="261.0" font-size="12" text-anchor="middle" style="fill:var(--b)">price of shortlisted</text><text x="108.0" y="276.0" font-size="12" text-anchor="middle" style="fill:var(--b)">brands = ceiling price</text><line x1="108.0" y1="286.0" x2="108.0" y2="312.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 305.0 L108.0 313.0 L113.0 305.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="314.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="331.0" font-size="12" text-anchor="middle">Step 5: add GST → maximum</text><text x="108.0" y="346.0" font-size="12" text-anchor="middle">retail price (MRP)</text><line x1="108.0" y1="356.0" x2="108.0" y2="382.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 375.0 L108.0 383.0 L113.0 375.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="384.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="401.0" font-size="12" text-anchor="middle">Step 6: NPPA notifies the</text><text x="108.0" y="416.0" font-size="12" text-anchor="middle">ceiling price in the</text><text x="108.0" y="431.0" font-size="12" text-anchor="middle">Official Gazette</text><line x1="208" y1="412.5" x2="216" y2="412.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="408.5" font-size="11" text-anchor="start">revised yearly by</text><text x="220.0" y="422.5" font-size="11" text-anchor="start">% change in WPI</text></svg>
