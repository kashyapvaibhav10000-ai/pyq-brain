<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 236" width="380" height="236" role="img" aria-label="Arachidonic acid metabolism by COX and LOX"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b;--p:#f8f5ee}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98;--p:#26231f}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i);font-size:12px}.b{font-weight:700}.s{font-size:10.5px}.r{fill:var(--a)}.y{fill:var(--b)}.g{fill:var(--g)}.l{stroke:var(--i);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke-width:1}.d{stroke-dasharray:4 3}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--i)" stroke-width="1.6"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--a)" stroke-width="1.6"/></marker></defs><rect x="90" y="6" width="180" height="24" rx="5" class="l"/><text x="180.0" y="22" text-anchor="middle">Membrane phospholipids</text><path d="M180 30 V54" class="l" marker-end="url(#h)"/><text x="188" y="46" text-anchor="start" class="s y">phospholipase A₂</text><rect x="105" y="56" width="150" height="24" rx="5" class="l"/><text x="180.0" y="72" text-anchor="middle" class="b">Arachidonic acid</text><path d="M150 80 L80 112 M210 80 L280 112" class="l" marker-end="url(#h)"/><text x="96" y="96" text-anchor="end" class="s y b">COX-1 / COX-2</text><text x="266" y="96" text-anchor="start" class="s y b">5-LOX</text><path d="M118 100 L132 112 M132 100 L118 112" class="l" style="stroke:var(--a);stroke-width:2.4"/><text x="126" y="128" text-anchor="middle" class="s r b">NSAIDs</text><rect x="20" y="140" width="120" height="24" rx="5" class="l"/><text x="80.0" y="156" text-anchor="middle">PGG₂ → PGH₂</text><rect x="220" y="140" width="120" height="24" rx="5" class="l"/><text x="280.0" y="156" text-anchor="middle">LTA₄</text><path d="M80 164 L40 190 M80 164 L96 190 M80 164 L160 190" class="l" marker-end="url(#h)"/><text x="40" y="204" text-anchor="middle" class="s b">PGE₂, PGF₂α</text><text x="40" y="216" text-anchor="middle" class="s">inflammation,</text><text x="40" y="228" text-anchor="middle" class="s">pain, fever</text><text x="98" y="204" text-anchor="middle" class="s b">PGI₂</text><text x="98" y="216" text-anchor="middle" class="s">endothelium</text><text x="98" y="228" text-anchor="middle" class="s">anti-aggregant</text><text x="166" y="204" text-anchor="middle" class="s b">TXA₂</text><text x="166" y="216" text-anchor="middle" class="s">platelets</text><text x="166" y="228" text-anchor="middle" class="s">aggregation</text><path d="M280 164 L246 190 M280 164 L322 190" class="l" marker-end="url(#h)"/><text x="240" y="204" text-anchor="middle" class="s b">LTB₄</text><text x="240" y="216" text-anchor="middle" class="s">chemotaxis</text><text x="324" y="204" text-anchor="middle" class="s b">LTC₄, D₄, E₄</text><text x="324" y="216" text-anchor="middle" class="s">bronchoconstriction</text></svg>
