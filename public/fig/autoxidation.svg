<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 359" width="360" height="359" role="img" aria-label="Autoxidation: free-radical chain reaction"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="68" rx="6" fill="none" stroke="var(--a)" stroke-width="2.2"/><text x="108.0" y="41.5" font-size="12" text-anchor="middle" style="fill:var(--a)">1. Initiation</text><line x1="208" y1="38.0" x2="216" y2="38.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="19.0" font-size="11" text-anchor="start">free radicals (R•)</text><text x="220.0" y="33.0" font-size="11" text-anchor="start">formed; catalysed</text><text x="220.0" y="47.0" font-size="11" text-anchor="start">by light, heat,</text><text x="220.0" y="61.0" font-size="11" text-anchor="start">metal ions</text><line x1="108.0" y1="72.0" x2="108.0" y2="98.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 91.0 L108.0 99.0 L113.0 91.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="100.0" width="200" height="83" rx="6" fill="none" stroke="var(--a)" stroke-width="2.2"/><text x="108.0" y="145.0" font-size="12" text-anchor="middle" style="fill:var(--a)">2. Propagation</text><line x1="208" y1="141.5" x2="216" y2="141.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="115.0" font-size="11" text-anchor="start">R• + O₂ → peroxy</text><text x="220.0" y="129.0" font-size="11" text-anchor="start">radical (ROO•),</text><text x="220.0" y="143.0" font-size="11" text-anchor="start">which attacks more</text><text x="220.0" y="157.0" font-size="11" text-anchor="start">drug molecules →</text><text x="220.0" y="171.0" font-size="11" text-anchor="start">chain</text><line x1="108.0" y1="183.0" x2="108.0" y2="209.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 202.0 L108.0 210.0 L113.0 202.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="211.0" width="200" height="53" rx="6" fill="none" stroke="var(--g)" stroke-width="2.2"/><text x="108.0" y="241.0" font-size="12" text-anchor="middle" style="fill:var(--g)">3. Termination</text><line x1="208" y1="237.5" x2="216" y2="237.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="226.0" font-size="11" text-anchor="start">radicals combine →</text><text x="220.0" y="240.0" font-size="11" text-anchor="start">stable, non-</text><text x="220.0" y="254.0" font-size="11" text-anchor="start">reactive products</text><path d="M108.0 264.0 L92.0 296.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="92.0" cy="296.0" r="2" fill="var(--i)"/><rect x="8.0" y="298.0" width="168.0" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="92.0" y="316.0" font-size="11.5" text-anchor="middle">Prevent: antioxidants</text><text x="92.0" y="330.5" font-size="11.5" text-anchor="middle">(ascorbic acid, BHA,</text><text x="92.0" y="345.0" font-size="11.5" text-anchor="middle">BHT)</text><path d="M108.0 264.0 L268.0 296.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="268.0" cy="296.0" r="2" fill="var(--i)"/><rect x="184.0" y="298.0" width="168.0" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="268.0" y="316.0" font-size="11.5" text-anchor="middle">Prevent: chelating</text><text x="268.0" y="330.5" font-size="11.5" text-anchor="middle">agents (EDTA) bind</text><text x="268.0" y="345.0" font-size="11.5" text-anchor="middle">metal ions</text></svg>
