<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" width="360" height="316" role="img" aria-label="Calcium channel blockers: mechanism"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle">L-type Ca²⁺ channels</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle">(vascular smooth muscle,</text><text x="108.0" y="51.0" font-size="12" text-anchor="middle">heart)</text><line x1="208" y1="32.5" x2="216" y2="32.5" stroke="var(--a)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="28.5" font-size="11" text-anchor="start" style="fill:var(--a)">✗ CCB blocks the</text><text x="220.0" y="42.5" font-size="11" text-anchor="start" style="fill:var(--a)">channel</text><line x1="108.0" y1="61.0" x2="108.0" y2="87.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 80.0 L108.0 88.0 L113.0 80.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="89.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="106.0" font-size="12" text-anchor="middle">↓ Ca²⁺ entry into the cell</text><line x1="108.0" y1="116.0" x2="108.0" y2="142.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 135.0 L108.0 143.0 L113.0 135.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="144.0" width="200" height="72" rx="6" fill="none" stroke="var(--g)" stroke-width="2.2"/><text x="108.0" y="161.0" font-size="12" text-anchor="middle" style="fill:var(--g)">Dihydropyridines</text><text x="108.0" y="176.0" font-size="12" text-anchor="middle" style="fill:var(--g)">(nifedipine, amlodipine):</text><text x="108.0" y="191.0" font-size="12" text-anchor="middle" style="fill:var(--g)">vascular smooth muscle</text><text x="108.0" y="206.0" font-size="12" text-anchor="middle" style="fill:var(--g)">relaxes</text><line x1="208" y1="180.0" x2="216" y2="180.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="176.0" font-size="11" text-anchor="start">vasodilation, ↓</text><text x="220.0" y="190.0" font-size="11" text-anchor="start">afterload, ↓ BP</text><line x1="108.0" y1="216.0" x2="108.0" y2="242.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 235.0 L108.0 243.0 L113.0 235.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="244.0" width="200" height="68" rx="6" fill="none" stroke="var(--g)" stroke-width="2.2"/><text x="108.0" y="266.5" font-size="12" text-anchor="middle" style="fill:var(--g)">Non-dihydropyridines</text><text x="108.0" y="281.5" font-size="12" text-anchor="middle" style="fill:var(--g)">(verapamil, diltiazem):</text><text x="108.0" y="296.5" font-size="12" text-anchor="middle" style="fill:var(--g)">also heart</text><line x1="208" y1="278.0" x2="216" y2="278.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="259.0" font-size="11" text-anchor="start">↓ heart rate, ↓</text><text x="220.0" y="273.0" font-size="11" text-anchor="start">contractility,</text><text x="220.0" y="287.0" font-size="11" text-anchor="start">slower AV</text><text x="220.0" y="301.0" font-size="11" text-anchor="start">conduction</text></svg>
