<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 104" width="340" height="104" role="img" aria-label="Tablet processing defects"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b;--p:#f8f5ee}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98;--p:#26231f}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i);font-size:12px}.b{font-weight:700}.s{font-size:10.5px}.r{fill:var(--a)}.y{fill:var(--b)}.g{fill:var(--g)}.l{stroke:var(--i);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke-width:1}.d{stroke-dasharray:4 3}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--i)" stroke-width="1.6"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--a)" stroke-width="1.6"/></marker></defs><text x="42" y="16" text-anchor="middle" class="b">Capping</text><rect x="10" y="30" width="64" height="10" rx="5" class="l" stroke-width="2" transform="rotate(-12 42 35)"/><rect x="10" y="46" width="64" height="18" rx="6" class="l" stroke-width="2"/><text x="42" y="82" text-anchor="middle" class="s">top separates</text><text x="42" y="95" text-anchor="middle" class="s y">(air, low binder)</text><text x="126" y="16" text-anchor="middle" class="b">Lamination</text><rect x="94" y="34" width="64" height="26" rx="10" class="l" stroke-width="2"/><path d="M96 42 H156 M96 50 H156 M96 56 H156" class="l t"/><text x="126" y="82" text-anchor="middle" class="s">splits into layers</text><text x="126" y="95" text-anchor="middle" class="s y">(excess pressure)</text><text x="210" y="16" text-anchor="middle" class="b">Picking</text><rect x="178" y="34" width="64" height="26" rx="10" class="l" stroke-width="2"/><path d="M190 34 Q194 42 198 34 M210 34 Q214 44 220 34" class="l"/><text x="210" y="82" text-anchor="middle" class="s">surface pulled off</text><text x="210" y="95" text-anchor="middle" class="s y">(rough punch)</text><text x="294" y="16" text-anchor="middle" class="b">Sticking</text><rect x="268" y="22" width="52" height="10" class="l"/><path d="M278 32 q4 6 8 0 q4 6 10 0" class="l"/><rect x="262" y="40" width="64" height="26" rx="10" class="l" stroke-width="2"/><text x="294" y="82" text-anchor="middle" class="s">sticks to punch</text><text x="294" y="95" text-anchor="middle" class="s y">(moist, no lubricant)</text></svg>
