<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-label="MEP / DXP (non-mevalonate) pathway, in plastids"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="30.0" y="4.0" width="300" height="27" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="180.0" y="21.0" font-size="12" text-anchor="middle" style="fill:var(--b)">Pyruvate + glyceraldehyde-3-phosphate</text><line x1="180.0" y1="31.0" x2="180.0" y2="58.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 51.0 L180.0 59.0 L185.0 51.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="49.0" font-size="11" text-anchor="start" style="fill:var(--b)">DXP synthase (TPP)</text><rect x="30.0" y="60.0" width="300" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="180.0" y="77.0" font-size="12" text-anchor="middle">DXP (1-deoxy-D-xylulose-5-phosphate)</text><line x1="180.0" y1="87.0" x2="180.0" y2="129.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 122.0 L180.0 130.0 L185.0 122.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="105.0" font-size="11" text-anchor="start" style="fill:var(--b)">DXP reductoisomerase</text><text x="188.0" y="119.0" font-size="11" text-anchor="start" style="fill:var(--b)">(fosmidomycin target)</text><rect x="30.0" y="131.0" width="300" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="180.0" y="148.0" font-size="12" text-anchor="middle" font-weight="700">MEP (2-C-methyl-D-erythritol-4-phosphate)</text><line x1="180.0" y1="158.0" x2="180.0" y2="185.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 178.0 L180.0 186.0 L185.0 178.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="176.0" font-size="11" text-anchor="start" style="fill:var(--b)">several steps</text><rect x="30.0" y="187.0" width="300" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="180.0" y="204.0" font-size="12" text-anchor="middle">CDP-ME → CDP-ME2P → ME-cPP → HMBPP</text><line x1="180.0" y1="214.0" x2="180.0" y2="241.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 234.0 L180.0 242.0 L185.0 234.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="232.0" font-size="11" text-anchor="start" style="fill:var(--b)">HMBPP reductase (IspH)</text><rect x="30.0" y="243.0" width="300" height="27" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="180.0" y="260.0" font-size="12" text-anchor="middle" style="fill:var(--b)">IPP + DMAPP</text><path d="M180.0 270.0 L92.0 302.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="92.0" cy="302.0" r="2" fill="var(--i)"/><rect x="8.0" y="304.0" width="168.0" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="92.0" y="322.0" font-size="11.5" text-anchor="middle">GPP (C10) →</text><text x="92.0" y="336.5" font-size="11.5" text-anchor="middle">monoterpenes</text><path d="M180.0 270.0 L268.0 302.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="268.0" cy="302.0" r="2" fill="var(--i)"/><rect x="184.0" y="304.0" width="168.0" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="268.0" y="322.0" font-size="11.5" text-anchor="middle">GGPP (C20) →</text><text x="268.0" y="336.5" font-size="11.5" text-anchor="middle">diterpenes (taxol),</text><text x="268.0" y="351.0" font-size="11.5" text-anchor="middle">carotenoids, phytol</text></svg>
