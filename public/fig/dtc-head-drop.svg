<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 401" width="360" height="401" role="img" aria-label="Bioassay of d-tubocurarine: rabbit head-drop method"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle">8 rabbits (~2 kg), 2</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle">groups of 4: standard vs</text><text x="108.0" y="51.0" font-size="12" text-anchor="middle">test</text><line x1="208" y1="32.5" x2="216" y2="32.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="28.5" font-size="11" text-anchor="start">rabbit in a</text><text x="220.0" y="42.5" font-size="11" text-anchor="start">holder, head free</text><line x1="108.0" y1="61.0" x2="108.0" y2="87.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 80.0 L108.0 88.0 L113.0 80.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="89.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="106.0" font-size="12" text-anchor="middle">Infuse d-TC (0.012% w/v in</text><text x="108.0" y="121.0" font-size="12" text-anchor="middle">saline) into marginal ear</text><text x="108.0" y="136.0" font-size="12" text-anchor="middle">vein</text><line x1="208" y1="117.5" x2="216" y2="117.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="121.0" font-size="11" text-anchor="start">0.4 mL/min, ~10 min</text><line x1="108.0" y1="146.0" x2="108.0" y2="172.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 165.0 L108.0 173.0 L113.0 165.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="174.0" width="200" height="68" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="211.5" font-size="12" text-anchor="middle" style="fill:var(--b)">End-point: head drop</text><line x1="208" y1="208.0" x2="216" y2="208.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="189.0" font-size="11" text-anchor="start">neck muscles</text><text x="220.0" y="203.0" font-size="11" text-anchor="start">relax; rabbit</text><text x="220.0" y="217.0" font-size="11" text-anchor="start">cannot hold its</text><text x="220.0" y="231.0" font-size="11" text-anchor="start">head up</text><line x1="108.0" y1="242.0" x2="108.0" y2="268.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 261.0 L108.0 269.0 L113.0 261.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="270.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="287.0" font-size="12" text-anchor="middle">Compare total dose of test</text><text x="108.0" y="302.0" font-size="12" text-anchor="middle">vs standard for the same</text><text x="108.0" y="317.0" font-size="12" text-anchor="middle">end-point</text><line x1="208" y1="298.5" x2="216" y2="298.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="287.0" font-size="11" text-anchor="start">cross-over test</text><text x="220.0" y="301.0" font-size="11" text-anchor="start">reduces animal</text><text x="220.0" y="315.0" font-size="11" text-anchor="start">variation</text><line x1="108.0" y1="327.0" x2="108.0" y2="353.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 346.0 L108.0 354.0 L113.0 346.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="355.0" width="200" height="42" rx="6" fill="none" stroke="var(--a)" stroke-width="2.2"/><text x="108.0" y="372.0" font-size="12" text-anchor="middle" style="fill:var(--a)">Respiratory distress →</text><text x="108.0" y="387.0" font-size="12" text-anchor="middle" style="fill:var(--a)">neostigmine + atropine IV</text></svg>
