<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 495" width="360" height="495" role="img" aria-label="Production of hard gelatin capsule shells"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle">Raw materials (gelatin,</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle">water, colourants)</text><line x1="108.0" y1="46.0" x2="108.0" y2="72.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 65.0 L108.0 73.0 L113.0 65.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="74.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="91.0" font-size="12" text-anchor="middle">Melting → gelatin solution</text><line x1="108.0" y1="101.0" x2="108.0" y2="127.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 120.0 L108.0 128.0 L113.0 120.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="129.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="146.0" font-size="12" text-anchor="middle">Holding and viscosity</text><text x="108.0" y="161.0" font-size="12" text-anchor="middle">control</text><line x1="208" y1="150.0" x2="216" y2="150.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="153.5" font-size="11" text-anchor="start">50–55 °C</text><line x1="108.0" y1="171.0" x2="108.0" y2="197.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 190.0 L108.0 198.0 L113.0 190.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="199.0" width="200" height="42" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="216.0" font-size="1