<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" width="360" height="282" role="img" aria-label="BCS classes by solubility and permeability"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b;--p:#f8f5ee}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98;--p:#26231f}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i);font-size:12px}.b{font-weight:700}.s{font-size:10.5px}.r{fill:var(--a)}.y{fill:var(--b)}.g{fill:var(--g)}.l{stroke:var(--i);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke-width:1}.d{stroke-dasharray:4 3}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--i)" stroke-width="1.6"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--a)" stroke-width="1.6"/></marker></defs><text x="205" y="16" text-anchor="middle" class="b">SOLUBILITY →</text><text x="130" y="34" text-anchor="middle" class="y b">High</text><text x="280" y="34" text-anchor="middle" class="y b">Low</text><text x="14" y="140" text-anchor="middle" class="b" transform="rotate(-90 14 140)">PERMEABILITY</text><text x="40" y="95" text-anchor="middle" class="y b">High</text><text x="40" y="215" text-anchor="middle" class="y b">Low</text><rect x="58" y="42" width="146" height="116" rx="6" class="l"/><text x="131" y="62" text-anchor="middle" class="b">Class I</text><text x="131" y="82" text-anchor="middle" class="s">Paracetamol,</text><text x="131" y="96" text-anchor="middle" class="s">metoprolol</text><text x="131" y="118" text-anchor="middle" class="s y">Fast absorption; limited</text><text x="131" y="131" text-anchor="middle" class="s y">only by gastric emptying</text><rect x="208" y="42" width="146" height="116" rx="6" class="l"/><text x="281" y="62" text-anchor="middle" class="b">Class II</text><text x="281" y="82" text-anchor="middle" class="s">Ibuprofen,</text><text x="281" y="96" text-anchor="middle" class="s">ketoconazole</text><text x="281" y="118" text-anchor="middle" class="s y">Dissolution</text><text x="281" y="131" text-anchor="middle" class="s y">rate-limiting →</text><text x="281" y="144" text-anchor="middle" class="s y">micronise, surfactants</text><rect x="58" y="162" width="146" height="116" rx="6" class="l"/><text x="131" y="182" text-anchor="middle" class="b">Class III</text><text x="131" y="202" text-anchor="middle" class="s">Cimetidine,</text><text x="131" y="216" text-anchor="middle" class="s">acyclovir</text><text x="131" y="238" text-anchor="middle" class="s y">Permeability-limiting →</text><text x="131" y="251" text-anchor="middle" class="s y">enhancers, prodrugs</text><rect x="208" y="162" width="146" height="116" rx="6" class="l"/><text x="281" y="182" text-anchor="middle" class="b">Class IV</text><text x="281" y="202" text-anchor="middle" class="s">Hydrochlorothiazide,</text><text x="281" y="216" text-anchor="middle" class="s">furosemide</text><text x="281" y="238" text-anchor="middle" class="s y">Poor solubility and</text><text x="281" y="251" text-anchor="middle" class="s y">permeability</text></svg>
