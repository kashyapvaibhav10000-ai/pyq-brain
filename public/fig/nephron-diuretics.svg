<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 286" width="380" height="286" role="img" aria-label="Sites of diuretic action in the nephron"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b;--p:#f8f5ee}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98;--p:#26231f}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i);font-size:12px}.b{font-weight:700}.s{font-size:10.5px}.r{fill:var(--a)}.y{fill:var(--b)}.g{fill:var(--g)}.l{stroke:var(--i);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke-width:1}.d{stroke-dasharray:4 3}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--i)" stroke-width="1.6"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--a)" stroke-width="1.6"/></marker></defs><circle cx="48" cy="32" r="16" class="l" stroke-width="2"/><text x="48" y="64" text-anchor="middle" class="s">Glomerulus</text><path d="M60 40 C60 80 90 90 120 90 C150 90 160 110 160 130 V230 Q160 252 180 252 Q200 252 200 230 V130 C200 110 220 100 250 100 C280 100 290 120 290 140 V250" class="l" stroke-width="5" stroke-opacity=".35"/><path d="M60 40 C60 80 90 90 120 90 C150 90 160 110 160 130 V230 Q160 252 180 252 Q200 252 200 230 V130 C200 110 220 100 250 100 C280 100 290 120 290 140 V250" class="l"/><text x="116" y="80" text-anchor="middle" class="b">PCT</text><text x="116" y="112" text-anchor="middle" class="s r">CA inhibitors</text><text x="116" y="124" text-anchor="middle" class="s r">(acetazolamide)</text><text x="116" y="138" text-anchor="middle" class="s r">osmotic (mannitol)</text><text x="135" y="200" text-anchor="end" class="s">Descending</text><text x="135" y="212" text-anchor="end" class="s">limb</text><text x="206" y="190" text-anchor="start" class="s">Thick ascending</text><text x="206" y="202" text-anchor="start" class="s">limb (Na⁺K⁺2Cl⁻)</text><text x="206" y="216" text-anchor="start" class="s r b">Loop diuretics</text><text x="206" y="228" text-anchor="start" class="s r">(furosemide)</text><text x="250" y="90" text-anchor="middle" class="b">DCT</text><text x="245" y="128" text-anchor="middle" class="s r b">Thiazides</text><text x="245" y="140" text-anchor="middle" class="s r">(NCC: Na⁺Cl⁻)</text><text x="300" y="160" text-anchor="start" class="b">Collecting</text><text x="300" y="172" text-anchor="start" class="b">duct</text><text x="300" y="190" text-anchor="start" class="s r b">K⁺-sparing</text><text x="300" y="202" text-anchor="start" class="s r">spironolactone,</text><text x="300" y="214" text-anchor="start" class="s r">amiloride,</text><text x="300" y="226" text-anchor="start" class="s r">triamterene</text><text x="180" y="276" text-anchor="middle" class="s y">ADH (vasopressin) also acts on the collecting duct (V2)</text></svg>
