<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 266" width="390" height="266" role="img" aria-label="Coagulation cascade with anticoagulant sites"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b;--p:#f8f5ee}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98;--p:#26231f}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i);font-size:12px}.b{font-weight:700}.s{font-size:10.5px}.r{fill:var(--a)}.y{fill:var(--b)}.g{fill:var(--g)}.l{stroke:var(--i);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke-width:1}.d{stroke-dasharray:4 3}</style><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--i)" stroke-width="1.6"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="var(--a)" stroke-width="1.6"/></marker></defs><rect x="10" y="8" width="150" height="24" rx="5" class="l"/><text x="85.0" y="24" text-anchor="middle">Intrinsic: XII → XI → IX</text><rect x="190" y="8" width="160" height="24" rx="5" class="l"/><text x="270.0" y="24" text-anchor="middle">Extrinsic: tissue factor + VII</text><path d="M85 32 L160 60 M270 32 L200 60" class="l" marker-end="url(#h)"/><rect x="130" y="62" width="100" height="24" rx="5" class="l"/><text x="180.0" y="78" text-anchor="middle" class="b">Factor X → Xa</text><path d="M180 86 V112" class="l" marker-end="url(#h)"/><rect x="88" y="114" width="184" height="24" rx="5" class="l"/><text x="180.0" y="130" text-anchor="middle" class="b" style="font-size:10.5px">Prothrombin (II) → Thrombin (IIa)</text><path d="M180 138 V164" class="l" marker-end="url(#h)"/><rect x="110" y="166" width="140" height="24" rx="5" class="l"/><text x="180.0" y="182" text-anchor="middle">Fibrinogen → Fibrin</text><path d="M180 190 V214" class="l" marker-end="url(#h)"/><rect x="135" y="216" width="90" height="24" rx="5" class="l"/><text x="180.0" y="232" text-anchor="middle" class="b">Stable clot</text><path d="M232 74 H262" class="l" stroke="var(--a)" style="stroke:var(--a)"/><text x="266" y="72" text-anchor="start" class="s r">Rivaroxaban, apixaban,</text><text x="266" y="84" text-anchor="start" class="s r">fondaparinux, LMWH</text><path d="M273 126 H284" class="l" style="stroke:var(--a)"/><text x="288" y="124" text-anchor="start" class="s r">Dabigatran,</text><text x="288" y="136" text-anchor="start" class="s r">heparin (+AT III)</text><text x="10" y="74" text-anchor="start" class="s r b">Warfarin ✗ vit-K-</text><text x="10" y="86" text-anchor="start" class="s r">dependent synthesis</text><text x="10" y="98" text-anchor="start" class="s r">of II, VII, IX, X</text><text x="10" y="110" text-anchor="start" class="s r">(liver)</text><text x="180" y="258" text-anchor="middle" class="s r">Red = sites where anticoagulants act</text></svg>
