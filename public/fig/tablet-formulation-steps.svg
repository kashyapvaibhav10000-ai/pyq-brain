<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" width="360" height="540" role="img" aria-label="Steps in formulation of tablets"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="83" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="49.0" font-size="12" text-anchor="middle">1. Preformulation studies</text><line x1="208" y1="45.5" x2="216" y2="45.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="19.0" font-size="11" text-anchor="start">solubility,</text><text x="220.0" y="33.0" font-size="11" text-anchor="start">stability,</text><text x="220.0" y="47.0" font-size="11" text-anchor="start">particle</text><text x="220.0" y="61.0" font-size="11" text-anchor="start">size/flow,</text><text x="220.0" y="75.0" font-size="11" text-anchor="start">compatibility</text><line x1="108.0" y1="87.0" x2="108.0" y2="113.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 106.0 L108.0 114.0 L113.0 106.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="115.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="132.0" font-size="12" text-anchor="middle">2. Selection of excipients</text><line x1="108.0" y1="142.0" x2="108.0" y2="168.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 161.0 L108.0 169.0 L113.0 161.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="170.0" width="200" height="53" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="200.0" font-size="12" text-anchor="middle">3. Manufacturing method</text><line x1="208" y1="196.5" x2="216" y2="196.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="185.0" font-size="11" text-anchor="start">wet granulation,</text><text x="220.0" y="199.0" font-size="11" text-anchor="start">dry granulation or</text><text x="220.0" y="213.0" font-size="11" text-anchor="start">direct compression</text><line x1="108.0" y1="223.0" x2="108.0" y2="249.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 242.0 L108.0 250.0 L113.0 242.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="251.0" width="200" height="53" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="281.0" font-size="12" text-anchor="middle">4. Granulation / blending</text><line x1="208" y1="277.5" x2="216" y2="277.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="266.0" font-size="11" text-anchor="start">granule formation,</text><text x="220.0" y="280.0" font-size="11" text-anchor="start">drying/sizing,</text><text x="220.0" y="294.0" font-size="11" text-anchor="start">lubricant addition</text><line x1="108.0" y1="304.0" x2="108.0" y2="330.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 323.0 L108.0 331.0 L113.0 323.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="332.0" width="200" height="38" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="354.5" font-size="12" text-anchor="middle">5. Compression</text><line x1="208" y1="351.0" x2="216" y2="351.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="347.0" font-size="11" text-anchor="start">control weight,</text><text x="220.0" y="361.0" font-size="11" text-anchor="start">thickness, hardness</text><line x1="108.0" y1="370.0" x2="108.0" y2="396.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 389.0 L108.0 397.0 L113.0 389.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="398.0" width="200" height="83" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="443.0" font-size="12" text-anchor="middle">6. Coating (if required)</text><line x1="208" y1="439.5" x2="216" y2="4