<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 339" width="360" height="339" role="img" aria-label="Phenylpropanoid pathway"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="30.0" y="4.0" width="300" height="27" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="180.0" y="21.0" font-size="12" text-anchor="middle" style="fill:var(--b)">L-Phenylalanine</text><line x1="180.0" y1="31.0" x2="180.0" y2="73.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 66.0 L180.0 74.0 L185.0 66.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="49.0" font-size="11" text-anchor="start" style="fill:var(--b)">PAL (phenylalanine</text><text x="188.0" y="63.0" font-size="11" text-anchor="start" style="fill:var(--b)">ammonia lyase)</text><rect x="30.0" y="75.0" width="300" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="180.0" y="92.0" font-size="12" text-anchor="middle">trans-Cinnamic acid</text><line x1="180.0" y1="102.0" x2="180.0" y2="144.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 137.0 L180.0 145.0 L185.0 137.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="120.0" font-size="11" text-anchor="start" style="fill:var(--b)">cinnamate 4-hydroxylase</text><text x="188.0" y="134.0" font-size="11" text-anchor="start" style="fill:var(--b)">(C4H)</text><rect x="30.0" y="146.0" width="300" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="180.0" y="163.0" font-size="12" text-anchor="middle">p-Coumaric acid</text><line x1="180.0" y1="173.0" x2="180.0" y2="215.0" stroke="var(--i)" stroke-width="1.5"/><path d="M175.0 208.0 L180.0 216.0 L185.0 208.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="188.0" y="191.0" font-size="11" text-anchor="start" style="fill:var(--b)">4-coumarate-CoA ligase</text><text x="188.0" y="205.0" font-size="11" text-anchor="start" style="fill:var(--b)">(4CL)</text><rect x="30.0" y="217.0" width="300" height="27" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="180.0" y="234.0" font-size="12" text-anchor="middle" style="fill:var(--b)">p-Coumaroyl-CoA (branch point)</text><path d="M180.0 244.0 L62.7 276.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="62.7" cy="276.0" r="2" fill="var(--i)"/><rect x="8.0" y="278.0" width="109.3" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="62.7" y="296.0" font-size="11.5" text-anchor="middle">Monolignols →</text><text x="62.7" y="310.5" font-size="11.5" text-anchor="middle">lignins,</text><text x="62.7" y="325.0" font-size="11.5" text-anchor="middle">lignans</text><path d="M180.0 244.0 L180.0 276.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="180.0" cy="276.0" r="2" fill="var(--i)"/><rect x="125.3" y="278.0" width="109.3" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="180.0" y="296.0" font-size="11.5" text-anchor="middle">+ Malonyl-CoA</text><text x="180.0" y="310.5" font-size="11.5" text-anchor="middle">→ chalcones →</text><text x="180.0" y="325.0" font-size="11.5" text-anchor="middle">flavonoids</text><path d="M180.0 244.0 L297.3 276.0" stroke="var(--i)" stroke-width="1.3" fill="none"/><circle cx="297.3" cy="276.0" r="2" fill="var(--i)"/><rect x="242.7" y="278.0" width="109.3" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="297.3" y="296.0" font-size="11.5" text-anchor="middle">Coumarins;</text><text x="297.3" y="310.5" font-size="11.5" text-anchor="middle">caffeic,</text><text x="297.3" y="325.0" font-size="11.5" text-anchor="middle">ferulic acid</text></svg>
