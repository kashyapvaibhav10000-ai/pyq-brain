<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" width="360" height="228" role="img" aria-label="Typical lipstick composition (%)"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><text x="8.0" y="19.0" font-size="11.5" text-anchor="start">Oils (castor,</text><text x="8.0" y="33.5" font-size="11.5" text-anchor="start">mineral)</text><rect x="150" y="16.0" width="112.5" height="14" fill="var(--b)" fill-opacity=".25"/><rect x="262.5" y="16.0" width="37.5" height="14" fill="var(--b)" fill-opacity=".6"/><text x="306.0" y="27.0" font-size="11" text-anchor="start">30–40%</text><text x="8.0" y="61.0" font-size="11.5" text-anchor="start">Waxes (carnauba,</text><text x="8.0" y="75.5" font-size="11.5" text-anchor="start">beeswax)</text><rect x="150" y="58.0" width="75.0" height="14" fill="var(--b)" fill-opacity=".25"/><rect x="225.0" y="58.0" width="37.5" height="14" fill="var(--b)" fill-opacity=".6"/><text x="268.5" y="69.0" font-size="11" text-anchor="start">20–30%</text><text x="8.0" y="103.5" font-size="11.5" text-anchor="start">Emollients &amp; lanolin</text><rect x="150" y="93.0" width="37.5" height="14" fill="var(--b)" fill-opacity=".25"/><rect x="187.5" y="93.0" width="18.8" height="14" fill="var(--b)" fill-opacity=".6"/><text x="212.2" y="104.0" font-size="11" text-anchor="start">10–15%</text><text x="8.0" y="131.5" font-size="11.5" text-anchor="start">Pigments &amp; colorants</text><rect x="150" y="121.0" width="18.8" height="14" fill="var(--b)" fill-opacity=".25"/><rect x="168.8" y="121.0" width="18.8" height="14" fill="var(--b)" fill-opacity=".6"/><text x="193.5" y="132.0" font-size="11" text-anchor="start">5–10%</text><text x="8.0" y="159.0" font-size="11.5" text-anchor="start">Film former (resin,</text><text x="8.0" y="173.5" font-size="11.5" text-anchor="start">PVP)</text><rec