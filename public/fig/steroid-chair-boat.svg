<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150" role="img" aria-label="Cyclohexane chair and boat conformations">
<style>:root{--i:#2a2420;--b:#2c4f9e}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--b:#9fb8f2}}
text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i);font-size:13px}.b{font-weight:700}.s{font-size:11px}.y{fill:var(--b)}
path{fill:none;stroke:var(--i);stroke-width:2;stroke-linejoin:round}</style>
<path d="M137.0 47.9 L111.0 55.2 L59.0 31.1 L33.0 72.1 L59.0 64.8 L111.0 88.9 Z"/>
<text x="85" y="112" text-anchor="middle" class="b">Chair</text>
<text x="85" y="128" text-anchor="middle" class="s y">more stable, no eclipsing</text>
<path d="M317.0 44.3 L291.0 49.1 L239.0 49.1 L213.0 44.3 L239.0 82.9 L291.0 82.9 Z"/>
<text x="265" y="112" text-anchor="middle" class="b">Boat</text>
<text x="265" y="128" text-anchor="middle" class="s y">less stable (flagpole clash)</text>
<text x="180" y="146" text-anchor="middle" class="s">Steroid rings A, B, C adopt the chair form</text>
</svg>
