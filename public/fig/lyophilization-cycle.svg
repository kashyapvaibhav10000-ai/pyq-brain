<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 363" width="360" height="363" role="img" aria-label="Lyophilization (freeze-drying) cycle"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="53" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="26.5" font-size="12" text-anchor="middle">Formulation + sterile</text><text x="108.0" y="41.5" font-size="12" text-anchor="middle">filling into vials</text><line x1="208" y1="30.5" x2="216" y2="30.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="19.0" font-size="11" text-anchor="start">bulking agent,</text><text x="220.0" y="33.0" font-size="11" text-anchor="start">stabiliser;</text><text x="220.0" y="47.0" font-size="11" text-anchor="start">partially stoppered</text><line x1="108.0" y1="57.0" x2="108.0" y2="83.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 76.0 L108.0 84.0 L113.0 76.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="85.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="102.0" font-size="12" text-anchor="middle">Freezing</text><line x1="208" y1="98.5" x2="216" y2="98.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="102.0" font-size="11" text-anchor="start">−40 to −50 °C</text><line x1="108.0" y1="112.0" x2="108.0" y2="138.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 131.0 L108.0 139.0 L113.0 131.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="140.0" width="200" height="68" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="170.0" font-size="12" text-anchor="middle" style="fill:var(--b)">Primary drying</text><text x="108.0" y="185.0" font-size="12" text-anchor="middle" style="fill:var(--b)">(sublimation)</text><line x1="208" y1="174.0" x2="216" y2="174.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="155.0" font-size="11" text-anchor="start">0.1–1 mbar; shelf</text><text x="220.0" y="169.0" font-size="11" text-anchor="start">−10 to −30 °C;</text><text x="220.0" y="183.0" font-size="11" text-anchor="start">removes ~90–95%</text><text x="220.0" y="197.0" font-size="11" text-anchor="start">water</text><line x1="108.0" y1="208.0" x2="108.0" y2="234.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 227.0 L108.0 235.0 L113.0 227.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="236.0" width="200" height="53" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="258.5" font-size="12" text-anchor="middle" style="fill:var(--b)">Secondary drying</text><text x="108.0" y="273.5" font-size="12" text-anchor="middle" style="fill:var(--b)">(desorption)</text><line x1="208" y1="262.5" x2="216" y2="262.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="251.0" font-size="11" text-anchor="start">+20 to +40 °C;</text><text x="220.0" y="265.0" font-size="11" text-anchor="start">residual moisture</text><text x="220.0" y="279.0" font-size="11" text-anchor="start">&lt; 1–3%</text><line x1="108.0" y1="289.0" x2="108.0" y2="315.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 308.0 L108.0 316.0 L113.0 308.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="317.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="334.0" font-size="12" text-anchor="middle">Stoppering under nitrogen</text><text x="108.0" y="349.0" font-size="12" text-anchor="middle">inside the lyophilizer</text></svg>
