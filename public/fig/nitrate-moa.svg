<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 498" width="360" height="498" role="img" aria-label="Nitrates (NO donors): mechanism of vasodilation"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="42" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle" style="fill:var(--b)">Organic nitrate</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle" style="fill:var(--b)">(nitroglycerin)</text><line x1="108.0" y1="46.0" x2="108.0" y2="88.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 81.0 L108.0 89.0 L113.0 81.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="116.0" y="64.0" font-size="11" text-anchor="start" style="fill:var(--b)">denitration in smooth muscle</text><text x="116.0" y="78.0" font-size="11" text-anchor="start" style="fill:var(--b)">(mtALDH2)</text><rect x="8" y="90.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="107.0" font-size="12" text-anchor="middle">Nitric oxide (NO)</text><line x1="108.0" y1="117.0" x2="108.0" y2="143.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 136.0 L108.0 144.0 L113.0 136.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="145.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="162.0" font-size="12" text-anchor="middle">Activates guanylyl cyclase</text><text x="108.0" y="177.0" font-size="12" text-anchor="middle">(binds its haem group)</text><line x1="108.0" y1="187.0" x2="108.0" y2="213.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 206.0 L108.0 214.0 L113.0 206.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="215.0" width="200" height="68" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="252.5" font-size="12" text-anchor="middle">GTP → cGMP</text><line x1="208" y1="249.0" x2="216" y2="249.0" stroke="var(--a)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="230.0" font-size="11" text-anchor="start" style="fill:var(--a)">PDE-5 breaks cGMP</text><text x="220.0" y="244.0" font-size="11" text-anchor="start" style="fill:var(--a)">→ GMP; sildenafil</text><text x="220.0" y="258.0" font-size="11" text-anchor="start" style="fill:var(--a)">blocks PDE-5 (with</text><text x="220.0" y="272.0" font-size="11" text-anchor="start" style="fill:var(--a)">nitrates: ↓↓ BP)</text><line x1="108.0" y1="283.0" x2="108.0" y2="310.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 303.0 L108.0 311.0 L113.0 303.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="116.0" y="301.0" font-size="11" text-anchor="start" style="fill:var(--b)">cGMP-dependent protein kinase</text><rect x="8" y="312.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="329.0" font-size="12" text-anchor="middle">Myosin light chain</text><text x="108.0" y="344.0" font-size="12" text-anchor="middle">dephosphorylated</text><line x1="108.0" y1="354.0" x2="108.0" y2="380.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 373.0 L108.0 381.0 L113.0 373.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="382.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="399.0" font-size="12" text-anchor="middle">Fewer actin–myosin cross-</text><text x="108.0" y="414.0" font-size="12" text-anchor="middle">bridges; ↓ Ca²⁺ entry</text><line x1="108.0" y1="424.0" x2="108.0" y2="450.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 443.0 L108.0 451.0 L113.0 443.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="452.0" width="200" height="42" rx="6" fill="none" stroke="var(--g)" stroke-width="2.2"/><text x="108.0" y="469.0" font-size="12" text-anchor="middle" style="fill:var(--g)">Smooth muscle relaxation →</text><text x="108.0" y="484.0" font-size="12" text-anchor="middle" style="fill:var(--g)">vasodilation</text></svg>
