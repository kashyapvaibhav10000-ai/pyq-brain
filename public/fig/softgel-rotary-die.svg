<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 407" width="360" height="407" role="img" aria-label="Soft gelatin capsules: rotary die process"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle">Gelatin ribbons form on</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle">two rotating dies</text><line x1="208" y1="25.0" x2="216" y2="25.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="28.5" font-size="11" text-anchor="start">gelatin 45–55 °C</text><line x1="108.0" y1="46.0" x2="108.0" y2="72.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 65.0 L108.0 73.0 L113.0 65.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="74.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="91.0" font-size="12" text-anchor="middle">Fill injected into the</text><text x="108.0" y="106.0" font-size="12" text-anchor="middle">pocket between upper and</text><text x="108.0" y="121.0" font-size="12" text-anchor="middle">lower ribbons</text><line x1="208" y1="102.5" x2="216" y2="102.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="106.0" font-size="11" text-anchor="start">fill 30–45 °C</text><line x1="108.0" y1="131.0" x2="108.0" y2="157.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 150.0 L108.0 158.0 L113.0 150.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="159.0" width="200" height="38" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="181.5" font-size="12" text-anchor="middle">Pressure seals the capsule</text><line x1="208" y1="178.0" x2="216" y2="178.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="174.0" font-size="11" text-anchor="start">die pressure 20–40</text><text x="220.0" y="188.0" font-size="11" text-anchor="start">psi</text><line x1="108.0" y1="197.0" x2="108.0" y2="223.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 216.0 L108.0 224.0 L113.0 216.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="225.0" width="200" height="57" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="242.0" font-size="12" text-anchor="middle">Cutters separate capsule</text><text x="108.0" y="257.0" font-size="12" text-anchor="middle">from ribbon; gelatin</text><text x="108.0" y="272.0" font-size="12" text-anchor="middle">residue falls away</text><line x1="108.0" y1="282.0" x2="108.0" y2="308.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 301.0 L108.0 309.0 L113.0 301.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="310.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="327.0" font-size="12" text-anchor="middle">Softening / conditioning</text><line x1="208" y1="323.5" x2="216" y2="323.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="327.0" font-size="11" text-anchor="start">50–55% RH, 2–4 h</text><line x1="108.0" y1="337.0" x2="108.0" y2="363.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 356.0 L108.0 364.0 L113.0 356.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="365.0" width="200" height="38" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="387.5" font-size="12" text-anchor="middle" style="fill:var(--b)">Separation, then drying</text><line x1="208" y1="384.0" x2="216" y2="384.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="380.0" font-size="11" text-anchor="start">moisture down to</text><text x="220.0" y="394.0" font-size="11" text-anchor="start">4–8%</text></svg>
