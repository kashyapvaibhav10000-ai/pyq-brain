<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" width="360" height="326" role="img" aria-label="Oral contraceptives: mechanism"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="42" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle" style="fill:var(--b)">Combined pill (estrogen +</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle" style="fill:var(--b)">progestin)</text><line x1="108.0" y1="46.0" x2="108.0" y2="72.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 65.0 L108.0 73.0 L113.0 65.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="74.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="91.0" font-size="12" text-anchor="middle">Prevent ovulation</text><line x1="208" y1="87.5" x2="216" y2="87.5" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="91.0" font-size="11" text-anchor="start">↓ LH and FSH</text><line x1="108.0" y1="101.0" x2="108.0" y2="127.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 120.0 L108.0 128.0 L113.0 120.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="129.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="146.0" font-size="12" text-anchor="middle">Disrupt the endometrium</text><line x1="108.0" y1="156.0" x2="108.0" y2="182.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 175.0 L108.0 183.0 L113.0 175.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="184.0" width="200" height="68" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="214.0" font-size="12" text-anchor="middle">Modify (thicken) cervical</text><text x="108.0" y="229.0" font-size="12" text-anchor="middle">mucus</text><line x1="208" y1="218.0" x2="216" y2="218.0" stroke="var(--i)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="199.0" font-size="11" text-anchor="start">blocks sperm</text><text x="220.0" y="213.0" font-size="11" text-anchor="start">entry; main action</text><text x="220.0" y="227.0" font-size="11" text-anchor="start">of progestin-only</text><text x="220.0" y="241.0" font-size="11" text-anchor="start">pill</text><line x1="108.0" y1="252.0" x2="108.0" y2="278.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 271.0 L108.0 279.0 L113.0 271.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="280.0" width="200" height="42" rx="6" fill="none" stroke="var(--g)" stroke-width="2.2"/><text x="108.0" y="297.0" font-size="12" text-anchor="middle" style="fill:var(--g)">No implantation → no</text><text x="108.0" y="312.0" font-size="12" text-anchor="middle" style="fill:var(--g)">pregnancy</text></svg>
