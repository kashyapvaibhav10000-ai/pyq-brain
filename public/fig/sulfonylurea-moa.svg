<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 271" width="360" height="271" role="img" aria-label="Sulfonylureas: mechanism"><style>:root{--i:#2a2420;--a:#c2412d;--b:#2c4f9e;--g:#3b7a4b}@media (prefers-color-scheme:dark){:root{--i:#ece4d6;--a:#ff917c;--b:#9fb8f2;--g:#86cf98}}text{font-family:"Helvetica Neue",Arial,sans-serif;fill:var(--i)}</style><rect x="8" y="4.0" width="200" height="57" rx="6" fill="none" stroke="var(--b)" stroke-width="2.2"/><text x="108.0" y="21.0" font-size="12" text-anchor="middle" style="fill:var(--b)">Sulfonylurea</text><text x="108.0" y="36.0" font-size="12" text-anchor="middle" style="fill:var(--b)">(glibenclamide,</text><text x="108.0" y="51.0" font-size="12" text-anchor="middle" style="fill:var(--b)">glimepiride)</text><line x1="108.0" y1="61.0" x2="108.0" y2="87.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 80.0 L108.0 88.0 L113.0 80.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="89.0" width="200" height="42" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="106.0" font-size="12" text-anchor="middle">Stimulates pancreatic β-</text><text x="108.0" y="121.0" font-size="12" text-anchor="middle">cells</text><line x1="108.0" y1="131.0" x2="108.0" y2="157.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 150.0 L108.0 158.0 L113.0 150.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="159.0" width="200" height="27" rx="6" fill="none" stroke="var(--i)" stroke-width="1.5"/><text x="108.0" y="176.0" font-size="12" text-anchor="middle">↑ Insulin secretion</text><line x1="108.0" y1="186.0" x2="108.0" y2="212.0" stroke="var(--i)" stroke-width="1.5"/><path d="M103.0 205.0 L108.0 213.0 L113.0 205.0" fill="none" stroke="var(--i)" stroke-width="1.5"/><rect x="8" y="214.0" width="200" height="53" rx="6" fill="none" stroke="var(--g)" stroke-width="2.2"/><text x="108.0" y="236.5" font-size="12" text-anchor="middle" style="fill:var(--g)">↓ Blood glucose (type 2</text><text x="108.0" y="251.5" font-size="12" text-anchor="middle" style="fill:var(--g)">diabetes)</text><line x1="208" y1="240.5" x2="216" y2="240.5" stroke="var(--a)" stroke-width="1.3" stroke-dasharray="3 2"/><text x="220.0" y="229.0" font-size="11" text-anchor="start" style="fill:var(--a)">Adverse:</text><text x="220.0" y="243.0" font-size="11" text-anchor="start" style="fill:var(--a)">hypoglycaemia,</text><text x="220.0" y="257.0" font-size="11" text-anchor="start" style="fill:var(--a)">weight gain</text></svg>
